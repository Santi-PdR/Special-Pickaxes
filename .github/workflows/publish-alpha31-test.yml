name: Publish validated alpha31 manual test
on:
  push:
    branches: ['arena/cec54523-special-pickaxes']
    paths: ['.github/workflows/publish-alpha31-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 44783621237 --json conclusion,headSha,event,workflowName > source-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('source-run.json'))
          assert run['conclusion']=='success'
          assert run['headSha']=='031b70ac9fb770c940add8493e4f480793600656'
          assert run['event']=='push' and run['workflowName']=='Forge verification'
          PY
          gh run download 44783621237 -n special-pickaxes-6.0.0-alpha.31-personal -D release
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('release')
          m=json.loads((root/'RELEASE.json').read_text())
          assert m['commit']=='031b70ac9fb770c940add8493e4f480793600656'
          assert str(m['run_id'])=='44783621237'
          assert m['file']=='special-pickaxes-1.20.1-6.0.0-alpha.31.jar'
          jar=root/'libs'/m['file']
          assert jar.stat().st_size==m['bytes']==991442
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==m['sha256']=='a52e8e8a89a6258aa7ad92ab3975ee7526df5feeed69765a49863a07c8f429a7'
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert not any('/test/' in name for name in z.namelist())
          PY
      - name: Publish explicitly requested test JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create test-6.0.0-alpha.31-44783621237 release/libs/special-pickaxes-1.20.1-6.0.0-alpha.31.jar release/RELEASE.json release/SHA256SUMS --target 031b70ac9fb770c940add8493e4f480793600656 --prerelease --latest=false --title 'Special Pickaxes 6.0.0-alpha.31 - prueba solicitada' --notes 'Prueba manual solicitada expresamente. Contiene las 13 activas equipadas y sus copias Worldbreaker. CI 44783621237 SUCCESS: 539 GameTests, cliente grafico y servidor. No es una version final ni aprobacion visual. G con slot Curios real aun pendiente de validacion dedicada. Requiere Minecraft 1.20.1, Forge 47.4.10 y Java 17; Curios opcional para las variantes equipadas. SHA256 a52e8e8a89a6258aa7ad92ab3975ee7526df5feeed69765a49863a07c8f429a7; 991442 bytes.'
