name: Publish validated alpha47 manual test
on:
  push:
    branches: ['arena/cec54523-special-pickaxes']
    paths: ['.github/workflows/publish-alpha47-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 44859312447 --json conclusion,headSha,event,workflowName > source-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('source-run.json'))
          assert run['conclusion']=='success'
          assert run['headSha']=='2ff45d89154fd1534107ec3e99a14f94ac2d9d77'
          assert run['event']=='push' and run['workflowName']=='Forge verification'
          PY
          gh run download 44859312447 -n special-pickaxes-6.0.0-alpha.47-personal -D release
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('release')
          m=json.loads((root/'RELEASE.json').read_text())
          assert m['commit']=='2ff45d89154fd1534107ec3e99a14f94ac2d9d77'
          assert str(m['run_id'])=='44859312447'
          assert m['file']=='special-pickaxes-1.20.1-6.0.0-alpha.47.jar'
          jar=root/'libs'/m['file']
          assert jar.stat().st_size==m['bytes']==998380
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==m['sha256']=='18010bf278f970eb2458bc55c41dcad2b5fe8eb1b2c40048a84751e9464735dc'
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert not any('/test/' in name for name in z.namelist())
          PY
      - name: Publish explicitly requested test JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create test-6.0.0-alpha.47-44859312447 release/libs/special-pickaxes-1.20.1-6.0.0-alpha.47.jar release/RELEASE.json release/SHA256SUMS --target 2ff45d89154fd1534107ec3e99a14f94ac2d9d77 --prerelease --latest=false --title 'Special Pickaxes 6.0.0-alpha.47 - prueba solicitada' --notes 'Mejora alpha.47: una de cada 16 inspecciones atiende celdas despejadas mientras avanza el frente, compartiendo el presupuesto existente; la ventana final de asentamiento empieza al agotar el frente, no antes. Conserva la correccion anterior: agotar el presupuesto de terreno conserva un seguimiento finito de bloques que lleguen a celdas despejadas; no expande terreno nuevo y respeta permisos, construcciones y equipo. Actualizacion solicitada de mineria frontal conectada: comienza cerca del jugador y sigue terreno conectado; asentamiento de arena y grava; Paradox secundaria inmediata y velocidad normal; ascenso excavador de Icarus; brillo solo en drops de menas del extractor; guia y Curios resumidos; activa equipada H (G queda para inventario Curios). Modelos/texturas y habilidades originales Iridium/Strata preservados. Fuente exacta 2ff45d89154fd1534107ec3e99a14f94ac2d9d77; CI 44859312447 SUCCESS: 214 JUnit, 549 GameTests, servidor y cliente real (32 escenas, 64 tooltips, H equipado, ascenso y activacion/cancelacion). Requiere Minecraft 1.20.1, Forge 47.4.10, Java 17; Curios opcional para variantes equipadas. Prerelease: no certifica todos los modpacks ni una aprobacion visual universal. Arte externo conserva sus creditos y avisos; no se concede una licencia adicional de redistribucion. SHA256 18010bf278f970eb2458bc55c41dcad2b5fe8eb1b2c40048a84751e9464735dc; 998380 bytes.'
