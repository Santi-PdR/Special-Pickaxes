name: Publish validated alpha57 manual test
on:
  push:
    branches: ['arena/cec54523-special-pickaxes']
    paths: ['.github/workflows/publish-alpha57-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 44966048410 --json conclusion,headSha,event,workflowName > source-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('source-run.json'))
          assert run['conclusion']=='success'
          assert run['headSha']=='322f5d65655c7b418f4a4001869461de3657b2d8'
          assert run['event']=='push' and run['workflowName']=='Forge verification'
          PY
          gh run download 44966048410 -n special-pickaxes-6.0.0-alpha.57-personal -D release
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('release')
          m=json.loads((root/'RELEASE.json').read_text())
          assert m['commit']=='322f5d65655c7b418f4a4001869461de3657b2d8'
          assert str(m['run_id'])=='44966048410'
          assert m['file']=='special-pickaxes-1.20.1-6.0.0-alpha.57.jar'
          jar=root/'libs'/m['file']
          assert jar.stat().st_size==m['bytes']==1001883
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==m['sha256']=='69a6b1f572d75a0f3f92851f5d554ea64ebeef9641dba28dfa530f54c574773b'
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert not any('/test/' in name for name in z.namelist())
          PY
      - name: Publish explicitly requested test JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create test-6.0.0-alpha.57-44966048410 release/libs/special-pickaxes-1.20.1-6.0.0-alpha.57.jar release/RELEASE.json release/SHA256SUMS --target 322f5d65655c7b418f4a4001869461de3657b2d8 --prerelease --latest=false --title 'Special Pickaxes 6.0.0-alpha.57 - prueba solicitada' --notes 'Alpha.57: la activa equipada comprueba herramienta real contra el objetivo antes y despues de permisos; herramienta inadecuada o reemplazo no cosechable no consumen durabilidad ni cooldown. Conserva alpha.56: la activacion frontal sostenida/equipada rechaza cambios de direccion durante callbacks de permisos, sin coste/cooldown equipado ni sobrescribir el giro externo. Mirar alrededor despues de activar sigue permitido. Conserva mineria frontal conectada, seguimiento de bloques que caen, loot sin pausas por densidad, Paradox secundaria inmediata, ascenso excavador de Icarus y brillo solo en drops de menas del extractor. Incluye pruebas adicionales de polvo de hormigon/yunques con caida real y agua/lava llegadas a celdas despejadas. Modelos/texturas y habilidades originales Iridium/Strata intactos; DropRecall congelado sin modificar. Fuente exacta 322f5d65655c7b418f4a4001869461de3657b2d8; CI 44966048410 SUCCESS: 216 JUnit, 574 GameTests, servidor/logs y cliente real (32 escenas, 64 tooltips). JAR exacto probado, sin recompilar. Minecraft 1.20.1, Forge 47.4.10, Java 17; Curios opcional para variantes equipadas. Prerelease: no certifica todos los modpacks ni aprobacion visual universal. Arte externo conserva creditos y avisos; no se concede licencia adicional de redistribucion. SHA256 69a6b1f572d75a0f3f92851f5d554ea64ebeef9641dba28dfa530f54c574773b; 1001883 bytes.'
