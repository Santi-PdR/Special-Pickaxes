name: Publish validated alpha58 manual test
on:
  push:
    branches: ['arena/cec54523-special-pickaxes']
    paths: ['.github/workflows/publish-alpha58-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 44970779846 --json conclusion,headSha,event,workflowName > source-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('source-run.json'))
          assert run['conclusion']=='success'
          assert run['headSha']=='10dae282de5a37b84e7a975b5e79b77011fa3f08'
          assert run['event']=='push' and run['workflowName']=='Forge verification'
          PY
          gh run download 44970779846 -n special-pickaxes-6.0.0-alpha.58-personal -D release
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('release')
          m=json.loads((root/'RELEASE.json').read_text())
          assert m['commit']=='10dae282de5a37b84e7a975b5e79b77011fa3f08'
          assert str(m['run_id'])=='44970779846'
          assert m['file']=='special-pickaxes-1.20.1-6.0.0-alpha.58.jar'
          jar=root/'libs'/m['file']
          assert jar.stat().st_size==m['bytes']==1001918
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==m['sha256']=='7d515040940231746846631169ed591a7fa99e299a0cb1d701d4130034b3f924'
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert not any('/test/' in name for name in z.namelist())
          PY
      - name: Publish explicitly requested test JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create test-6.0.0-alpha.58-44970779846 release/libs/special-pickaxes-1.20.1-6.0.0-alpha.58.jar release/RELEASE.json release/SHA256SUMS --target 10dae282de5a37b84e7a975b5e79b77011fa3f08 --prerelease --latest=false --title 'Special Pickaxes 6.0.0-alpha.58 - prueba solicitada' --notes 'Alpha.58: la mineria frontal sostenida comprueba cosechabilidad inicial antes y despues de permisos. Objetivos con tier Forge superior no inician ni cobran activacion; sustituciones externas se preservan y se puede reintentar con objetivo valido. Conserva alpha.57: activa equipada sin cobro por herramienta inadecuada. Conserva objetivo/direccion coherentes durante activacion, mineria frontal conectada, seguimiento de bloques que caen y loot sin pausas por densidad. Modelos/texturas y habilidades originales Iridium/Strata intactos; DropRecall congelado sin modificar. Fuente exacta 10dae282de5a37b84e7a975b5e79b77011fa3f08; CI 44970779846 SUCCESS: 216 JUnit, 576 GameTests, servidor/logs y cliente real (32 escenas, 64 tooltips, dos techos Icaro). JAR exacto probado, sin recompilar. Minecraft 1.20.1, Forge 47.4.10, Java 17; Curios opcional para variantes equipadas. Prerelease: no certifica todos los modpacks ni aprobacion visual universal. Arte externo conserva creditos y avisos; no se concede licencia adicional de redistribucion. SHA256 7d515040940231746846631169ed591a7fa99e299a0cb1d701d4130034b3f924; 1001918 bytes.'
