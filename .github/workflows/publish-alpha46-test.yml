name: Publish validated alpha46 manual test
on:
  push:
    branches: ['arena/cec54523-special-pickaxes']
    paths: ['.github/workflows/publish-alpha46-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 44850183303 --json conclusion,headSha,event,workflowName > source-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('source-run.json'))
          assert run['conclusion']=='success'
          assert run['headSha']=='d93e92218cfeabfc424cd4f3d3cc8a1ba96184cf'
          assert run['event']=='push' and run['workflowName']=='Forge verification'
          PY
          gh run download 44850183303 -n special-pickaxes-6.0.0-alpha.46-personal -D release
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('release')
          m=json.loads((root/'RELEASE.json').read_text())
          assert m['commit']=='d93e92218cfeabfc424cd4f3d3cc8a1ba96184cf'
          assert str(m['run_id'])=='44850183303'
          assert m['file']=='special-pickaxes-1.20.1-6.0.0-alpha.46.jar'
          jar=root/'libs'/m['file']
          assert jar.stat().st_size==m['bytes']==998287
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==m['sha256']=='dcb7fb9ce402a5bb60263aaaef3afe84d6cf012b2279cd896972e2782b088cc5'
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert not any('/test/' in name for name in z.namelist())
          PY
      - name: Publish explicitly requested test JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create test-6.0.0-alpha.46-44850183303 release/libs/special-pickaxes-1.20.1-6.0.0-alpha.46.jar release/RELEASE.json release/SHA256SUMS --target d93e92218cfeabfc424cd4f3d3cc8a1ba96184cf --prerelease --latest=false --title 'Special Pickaxes 6.0.0-alpha.46 - prueba solicitada' --notes 'Correccion alpha.46: agotar el presupuesto de terreno conserva un seguimiento finito de bloques que lleguen a celdas despejadas; no expande terreno nuevo y respeta permisos, construcciones y equipo. Actualizacion solicitada de mineria frontal conectada: comienza cerca del jugador y sigue terreno conectado; asentamiento de arena y grava; Paradox secundaria inmediata y velocidad normal; ascenso excavador de Icarus; brillo solo en drops de menas del extractor; guia y Curios resumidos; activa equipada H (G queda para inventario Curios). Modelos/texturas y habilidades originales Iridium/Strata preservados. Fuente exacta d93e92218cfeabfc424cd4f3d3cc8a1ba96184cf; CI 44850183303 SUCCESS: 214 JUnit, 548 GameTests, servidor y cliente real (32 escenas, 64 tooltips, H equipado, ascenso y activacion/cancelacion). Requiere Minecraft 1.20.1, Forge 47.4.10, Java 17; Curios opcional para variantes equipadas. Prerelease: no certifica todos los modpacks ni una aprobacion visual universal. Arte externo conserva sus creditos y avisos; no se concede una licencia adicional de redistribucion. SHA256 dcb7fb9ce402a5bb60263aaaef3afe84d6cf012b2279cd896972e2782b088cc5; 998287 bytes.'
