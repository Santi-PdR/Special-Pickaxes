name: Publish validated reform7 dev1 requested test
on:
  push:
    branches: ['arena/cec54523-special-pickaxes']
    paths: ['.github/workflows/publish-reform7-dev1-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify successful source build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 45493428135 --json conclusion,headSha,event,workflowName > source-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('source-run.json'))
          assert run['conclusion']=='success'
          assert run['headSha']=='7ac57b865208098355fc88f6121b49aea58029bb'
          assert run['event']=='push' and run['workflowName']=='Forge verification'
          PY
          gh run download 45493428135 -n special-pickaxes-7.0.0-dev.1-personal -D release
          python3 - <<'PY'
          import hashlib,json,pathlib,zipfile
          root=pathlib.Path('release')
          m=json.loads((root/'RELEASE.json').read_text())
          assert m['commit']=='7ac57b865208098355fc88f6121b49aea58029bb'
          assert str(m['run_id'])=='45493428135'
          assert m['file']=='special-pickaxes-1.20.1-7.0.0-dev.1.jar'
          jar=root/'libs'/m['file']
          assert jar.stat().st_size==m['bytes']==1010605
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==m['sha256']=='6f64e4bb2edd22be02aa96de1da1e6971f75cdac4f5c5c018a706293b42f1237'
          with zipfile.ZipFile(jar) as z:
              assert z.testzip() is None
              assert not any('/test/' in name for name in z.namelist())
          PY
      - name: Publish explicitly requested test JAR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create test-7.0.0-dev.1-45493428135 release/libs/special-pickaxes-1.20.1-7.0.0-dev.1.jar release/RELEASE.json release/SHA256SUMS --target 7ac57b865208098355fc88f6121b49aea58029bb --prerelease --latest=false --title 'Special Pickaxes 7.0.0-dev.1 - prueba solicitada' --notes 'Prueba de reforma7 solicitada para instalacion mediante PowerShell. NO version estable, NO alpha.60, NO reforma global cerrada: rendimiento causal FPS/TPS, balance percibido y compatibilidad universal de modpacks siguen pendientes. JAR exacto probado sin recompilar, fuente7ac57b865208098355fc88f6121b49aea58029bb, CI45493428135 SUCCESS:218JUnit/620GameTests/cliente real32escenas64tooltips y bolsa abierta actualizada10renders. Firmas distintas, Curios efectos sin mineria, bolsa integrada y retirada segura. Conserva loot nativo y deja entidades con nombres/datos persistentes/subclases custom en mundo. Carga16trabajos1037materiales conservados,max192intentos,intervalo2turnos: no benchmarkTPS/FPS/TCP. Modelos/texturas y originalesIridium/Strata intactos. Minecraft1.20.1/Forge47.4.10/Java17. Arte externo conserva creditos/avisos, sin licencia adicional de redistribucion. SHA256 6f64e4bb2edd22be02aa96de1da1e6971f75cdac4f5c5c018a706293b42f1237;1010605bytes.'
