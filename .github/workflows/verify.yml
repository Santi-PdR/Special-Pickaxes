name: Forge verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/validate_resources.py
      - run: ./gradlew build test --stacktrace
      - run: ./gradlew runGameTestServer --stacktrace
      - run: git diff --check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-validation
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/
            run/gametest*xml
