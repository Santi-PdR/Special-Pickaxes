name: Forge verification
on:
  push:
    paths-ignore:
      - docs/mining-rework/VISUAL-REVIEW.json
      - docs/mining-rework/STATUS.md
      - README.md
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  checks: write
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare CI evidence directory
        run: mkdir -p build
      - run: python3 tools/validate_resources.py
      - run: python3 -m unittest discover -s tools -p "test_*.py"
      - run: python3 tools/scan_secrets.py
      - run: python3 tools/withdraw_unvalidated.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          mkdir -p build
          set -o pipefail
          ./gradlew build test --stacktrace 2>&1 | tee build/verification-build.log
      - run: python3 tools/verify_release.py
      - id: mod-version
        run: |
          python3 - <<'PY'
          import os,re
          version=re.search(r"^version\s*=\s*'([^']+)'",open('build.gradle').read(),re.M).group(1)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('value='+version+'\n')
          PY
      - run: python3 tools/scan_secrets.py "build/libs/$(python3 -c 'import json; print(json.load(open("build/RELEASE.json"))["file"])')" | tee build/verification-security.log
      - run: |
          set -o pipefail
          ./gradlew runGameTestServer --stacktrace 2>&1 | tee build/verification-gametest.log
          mkdir -p run/logs
          gametest_log=$(find build -path 'build/gametest-*/logs/latest.log' -type f -print -quit)
          test -n "$gametest_log"
          cp "$gametest_log" run/logs/gametest.log
          python3 tools/validate_runtime_logs.py run/logs/gametest.log
          python3 tools/verify_gametests.py run/logs/gametest.log
      - run: |
          set -o pipefail
          python3 tools/dedicated_smoke.py 2>&1 | tee build/verification-packaged.log
      - run: python3 tools/validate_runtime_logs.py run/logs/gametest.log build/packaged-smoke/console.log
      - name: Client runtime dependencies
        timeout-minutes: 14
        run: |
          timeout 300s sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          timeout 600s sudo apt-get install -y xvfb libflite1
      - name: Real client gallery and normal and SHIFT tooltip captures
        timeout-minutes: 22
        run: |
          set -o pipefail
          python3 tools/client_smoke.py 2>&1 | tee build/verification-client.log
        env:
          GH_TOKEN: ${{ github.token }}
      - run: git diff --check
      - name: Check publication approval
        id: publication
        run: |
          echo "approved=false" >> "$GITHUB_OUTPUT"
          if ! test -f docs/mining-rework/VISUAL-REVIEW.json; then
            echo "::notice::Binary publication skipped: no visual review is recorded."
            exit 0
          fi
          if python3 tools/verify_visual_review.py; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Binary publication skipped: the visual review does not approve this exact source."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 tools/ci_evidence.py
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BINARY: ${{ job.status == 'success' && (steps.publication.outputs.approved == 'true' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/cec54523-special-pickaxes')) }}
      - name: Publish verified release only
        if: success() && steps.publication.outputs.approved == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: special-pickaxes-${{ steps.mod-version.outputs.value }}-verified
          path: |
            build/libs/*.jar
            build/RELEASE.json
            build/SHA256SUMS
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forge-validation
          path: |
            build/reports/
            run/logs/
            run/gametest*xml
            build/packaged-smoke/console.log
            build/verification-*.log
            build/evidence-manifest.json
            build/evidence-export.json
            build/RELEASE.json
            build/SHA256SUMS
            build/client-smoke/

      # Explicitly requested manual test installation. This is NOT visual/stable approval.
      # Publish only after every verification, evidence export and artifact upload succeeded.
      - name: Publish downloadable test build (not visually approved)
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/arena/cec54523-special-pickaxes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,subprocess
          manifest=json.loads(pathlib.Path('build/RELEASE.json').read_text())
          assert manifest['commit']==os.environ['GITHUB_SHA']
          assert str(manifest['run_id'])==os.environ['GITHUB_RUN_ID']
          jar=pathlib.Path('build/libs')/manifest['file']
          assert jar.parent==pathlib.Path('build/libs') and jar.suffix=='.jar'
          assert jar.stat().st_size==manifest['bytes']
          assert hashlib.sha256(jar.read_bytes()).hexdigest()==manifest['sha256']
          version=manifest['file'].removeprefix('special-pickaxes-1.20.1-').removesuffix('.jar')
          tag='test-'+version+'-'+os.environ['GITHUB_RUN_ID']
          notes=('Build de prueba para instalacion manual solicitada. No es una version estable ni una aprobacion visual completa. '
                 'JAR, JUnit, GameTests, servidor, logs y cliente verificados por CI. '
                 'Fuente: '+os.environ['GITHUB_SHA']+'\n'
                 'Run: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n'
                 'SHA256: '+manifest['sha256'])
          subprocess.run(['gh','release','create',tag,str(jar),'build/RELEASE.json','build/SHA256SUMS',
                          '--repo',os.environ['GITHUB_REPOSITORY'],'--target',os.environ['GITHUB_SHA'],
                          '--prerelease','--latest=false','--title','Special Pickaxes '+version+' - prueba CI',
                          '--notes',notes],check=True)
          PYTHON
