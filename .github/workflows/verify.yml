name: Forge verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  checks: write
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 tools/validate_resources.py
      - run: |
          mkdir -p build
          set -o pipefail
          ./gradlew build test --stacktrace 2>&1 | tee build/verification-build.log
      - run: python3 tools/verify_release.py
      - run: |
          set -o pipefail
          ./gradlew runGameTestServer --stacktrace 2>&1 | tee build/verification-gametest.log
          cp run/logs/latest.log run/logs/gametest.log
      - run: |
          set -o pipefail
          python3 tools/dedicated_smoke.py 2>&1 | tee build/verification-packaged.log
      - run: python3 tools/validate_runtime_logs.py run/logs/latest.log build/packaged-smoke/console.log
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libflite1
          set -o pipefail
          python3 tools/client_smoke.py 2>&1 | tee build/verification-client.log
      - if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: python3 tools/ci_evidence.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: git diff --check
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forge-validation
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/
            run/gametest*xml
            build/packaged-smoke/console.log
            build/verification-*.log
            build/evidence-manifest.json
            build/RELEASE.json
            build/SHA256SUMS
            build/client-smoke/
