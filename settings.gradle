pluginManagement {
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.minecraftforge.gradle') {
                // Resolve the published implementation directly, without requiring a separate
                // plugin-marker artifact. Keep the same ForgeGradle version constraint.
                useModule("net.minecraftforge.gradle:ForgeGradle:${requested.version}")
            }
        }
    }
    repositories {
        maven {
            name = 'ForgePluginArtifacts'
            url = 'https://maven.minecraftforge.net/'
            content { includeGroupByRegex 'net\\.minecraftforge(\\..*)?' }
        }
        maven {
            name = 'CentralPluginDependencies'
            url = 'https://repo1.maven.org/maven2/'
            content { excludeGroupByRegex 'net\\.minecraftforge(\\..*)?' }
        }
    }
}
rootProject.name = 'special-pickaxes'
