plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'io.github.santipdr.specialpickaxes'
version = '6.0.0-alpha.42'
base { archivesName = 'special-pickaxes-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { specialpickaxes { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('clientSmoke')) {
                property 'specialpickaxes.clientSmoke', 'true'
                // Curios ships SRG mixin references; runClient uses official names.
                // Remap its refmap only in this disposable development client.
                property 'mixin.env.remapRefMap', 'true'
                property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath
                args '--username', 'ArtifactTester', '--quickPlaySingleplayer', 'ArtifactSmoke', '--width', '1280', '--height', '720'
                jvmArgs '-Xmx2G'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file("build/gametest-${project.version}")
            property 'specialpickaxes.testConfig', 'true'
            property 'specialpickaxes.testFluids', 'true'
            property 'specialpickaxes.testOres', 'true'
            property 'forge.enabledGameTestNamespaces', 'specialpickaxes'
        }
    }
}
repositories {
    if (project.hasProperty('clientSmoke')) {
        maven { url = 'https://maven.theillusivec4.top/'; content { includeGroup 'top.theillusivec4.curios' } }
    }
    // Forge/Minecraft coordinates do not belong to Central. A 429 there must not
    // prevent Gradle reaching ForgeGradle's generated Minecraft repository.
    maven {
        name = 'MavenCentralOfficial'
        url = 'https://repo1.maven.org/maven2/'
        content {
            excludeGroupByRegex 'net\\.minecraftforge(\\..*)?'
            excludeGroup 'net.minecraft'
            excludeGroup 'cpw.mods'
        }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    if (project.hasProperty('clientSmoke')) runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('verifyMobEffectIcons') {
    group = 'verification'
    description = 'Ensures every registered custom mob effect has a source texture icon.'
    inputs.file('src/main/java/io/github/santipdr/specialpickaxes/SpecialPickaxes.java')
    inputs.dir('src/main/resources/assets/specialpickaxes/textures/mob_effect')
    doLast {
        def source = file('src/main/java/io/github/santipdr/specialpickaxes/SpecialPickaxes.java').text
        def effectIds = (source =~ /EFFECTS\.register\("([^"]+)"/).collect { it[1] }
        def iconDirectory = file('src/main/resources/assets/specialpickaxes/textures/mob_effect')
        def missing = effectIds.findAll { id -> !new File(iconDirectory, "${id}.png").isFile() }
        if (effectIds.isEmpty() || !missing.isEmpty()) {
            throw new GradleException("Custom mob effect icons missing: ${missing ?: 'no effects found'}")
        }
        logger.lifecycle("Verified ${effectIds.size()} custom mob effect icons.")
    }
}
tasks.register('validateResourceCatalog', Exec) {
    group = 'verification'
    description = 'Validates translations, mining modes, assets and pickaxe manuals.'
    inputs.files(fileTree('src/main/resources'), file('tools/validate_resources.py'), file('tools/mining_catalog.py'))
    commandLine 'python3', 'tools/validate_resources.py'
}
tasks.named('check').configure {
    dependsOn tasks.named('verifyMobEffectIcons')
    dependsOn tasks.named('validateResourceCatalog')
}
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}
test { useJUnitPlatform() }
jar {
    manifest { attributes('Implementation-Version': project.version, 'Build-Commit': providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()) }
    exclude 'io/github/santipdr/specialpickaxes/test/**'
    exclude 'data/specialpickaxes/structures/empty.nbt'
    exclude 'data/pickaxe_compat_test/**'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def properties = file("build/gametest-${project.version}/server.properties")
        properties.parentFile.mkdirs()
        // The disposable GameTest world must not spawn village AI that opens doors
        // and recursively generates neighboring lava chunks during unrelated tests.
        // Keep strict runtime-log checks; isolate the test world instead.
        if (!properties.exists()) properties.text = 'spawn-protection=0\ngenerate-structures=false\nlevel-seed=0\n'
    }
}
// Generate the mapping before Mixin reads the external Curios refmap.
if (project.hasProperty('clientSmoke')) {
    tasks.named('createSrgToMcp').configure {
        setFormat('SRG')
        getOutput().set(layout.buildDirectory.file('createSrgToMcp/output.srg'))
    }
    // ForgeGradle registers runClient after evaluating this script.
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'createSrgToMcp' }
}
