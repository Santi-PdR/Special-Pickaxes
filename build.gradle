plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'io.github.santipdr.specialpickaxes'
version = '5.10.278'
base { archivesName = 'special-pickaxes-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { specialpickaxes { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('clientSmoke')) {
                property 'specialpickaxes.clientSmoke', 'true'
                args '--username', 'ArtifactTester', '--quickPlaySingleplayer', 'ArtifactSmoke', '--width', '1280', '--height', '720'
                jvmArgs '-Xmx2G'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file("build/gametest-${project.version}")
            property 'specialpickaxes.testFluids', 'true'
            property 'specialpickaxes.testOres', 'true'
            property 'forge.enabledGameTestNamespaces', 'specialpickaxes'
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.register('verifyMobEffectIcons') {
    group = 'verification'
    description = 'Ensures every registered custom mob effect has a source texture icon.'
    inputs.file('src/main/java/io/github/santipdr/specialpickaxes/SpecialPickaxes.java')
    inputs.dir('src/main/resources/assets/specialpickaxes/textures/mob_effect')
    doLast {
        def source = file('src/main/java/io/github/santipdr/specialpickaxes/SpecialPickaxes.java').text
        def effectIds = (source =~ /EFFECTS\.register\("([^"]+)"/).collect { it[1] }
        def iconDirectory = file('src/main/resources/assets/specialpickaxes/textures/mob_effect')
        def missing = effectIds.findAll { id -> !new File(iconDirectory, "${id}.png").isFile() }
        if (effectIds.isEmpty() || !missing.isEmpty()) {
            throw new GradleException("Custom mob effect icons missing: ${missing ?: 'no effects found'}")
        }
        logger.lifecycle("Verified ${effectIds.size()} custom mob effect icons.")
    }
}
tasks.named('check').configure { dependsOn tasks.named('verifyMobEffectIcons') }
tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [mod_version: project.version]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}
test { useJUnitPlatform() }
jar {
    manifest { attributes('Implementation-Version': project.version, 'Build-Commit': providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()) }
    exclude 'io/github/santipdr/specialpickaxes/test/**'
    exclude 'data/specialpickaxes/structures/empty.nbt'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    finalizedBy 'reobfJar'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        def properties = file("build/gametest-${project.version}/server.properties")
        properties.parentFile.mkdirs()
        if (!properties.exists()) properties.text = 'spawn-protection=0\n'
    }
}
